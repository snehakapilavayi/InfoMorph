<p class="text-xs sm:text-sm text-brand-muted">Upload a file, paste text, or add a link to get started.</p>

<textarea class="w-full border-none resize-none p-0 text-sm text-brand-text placeholder-[#9AAB9B] bg-transparent focus:ring-0" placeholder="Message InfoMorph or add your source..." rows="3"></textarea>

<div class="flex items-center justify-between pt-3 mt-2 border-t border-brand-borderSubtle">

<path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>

<div class="mt-0.5 text-brand group-hover:scale-105 transition-transform">

<div class="mt-0.5 text-brand group-hover:scale-105 transition-transform">

<path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<div>
<p class="text-xs font-semibold text-brand-text leading-tight">Add Link</p>
<p class="text-[10px] text-brand-muted mt-0.5">Add a URL link</p>

<button class="px-3.5 py-1.5 text-xs font-normal text-brand-text bg-white border border-[#DCE7D9] rounded-lg hover:border-brand hover:text-brand transition" type="button">
